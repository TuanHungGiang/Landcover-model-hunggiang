name: LoveDA CPU/DDP regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-ddp-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy Pillow
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Check Python syntax
        run: |
          python -m compileall -q scripts sdr_mambanet tests
      - name: Test distributed validation, BN synchronization and domain holdout
        run: |
          OMP_NUM_THREADS=1 python -m pytest -q \
            tests/test_holdout_domains.py \
            tests/test_dist_eval.py \
            tests/test_automatic_holdout.py \
            tests/test_ddp_hang_diagnostics.py \
            tests/test_ddp_startup.py \
            tests/test_hcr_model.py
