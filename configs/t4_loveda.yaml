# Reference settings; runnable CLI: python scripts/train_loveda.py --context conv --size 512 --batch 1 --accum 4 --epochs 100
data:
  dataset: loveda
  root: /kaggle/input/datasets/alienxc137/loveda-satellite-images-semantic-segmentation
  train_structure: Train/Train/{Rural,Urban}/{images_png,masks_png}
  val_structure: Val/Val/{Rural,Urban}/{images_png,masks_png}
  crop_size: 512
  ignore_index: 255
model:
  num_classes: 7
  semantic_encoder: resnet34
  pretrained_semantic: true
  context_type: conv
  context_dim: 160
  context_depth: 2
train:
  epochs: 100
  batch_size_per_gpu: 1
  grad_accum_steps: 4
  lr: 0.0002
  output_dir: /kaggle/working/sdr_loveda
